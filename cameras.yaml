# Registro de cámaras.
#
# Cada cámara trae su propia calibración porque depende del ángulo y del
# encuadre: la ROI y los umbrales de una NO sirven para otra.
#
#   roi          -> lo que imprime  scripts/roi_picker.py --camera <id>
#   thresholds   -> lo que imprime  scripts/traffic_calibrate.py --camera <id>
#
# `source` puede ser una ruta relativa a la raíz del repo o, en producción,
# una URL RTSP.

cameras:
  - id: cra64c_cl78
    name: "Cra 64C × Cl 78"
    source: "videos/input/Grabación 2026-08-26 142508.mp4"
    lat: 6.2716
    lng: -75.5900
    # Dos calzadas, sin el separador de concreto del medio.
    roi: "0.0021,0.9891 0.0031,0.5043 0.3075,0.0065 0.4655,0.0087 0.3316,0.9935 0.4446,0.9978 0.4833,0.0043 0.6056,0.0000 0.9927,0.7739 0.9937,0.9891"
    perspective: 2.5
    thresholds:
      occupancy_medium: 0.24
      occupancy_high: 0.41
      free_speed: 0.065
    notes: "Calibrada con los frames 0-400 del clip de demo."

  - id: cra55_cl37
    name: "Cra 55 × Cl 37"
    # El clip de demo cambia de cámara en el frame 569, así que por ahora
    # las dos entradas apuntan al mismo archivo.
    source: "videos/input/Grabación 2026-08-26 142508.mp4"
    # Corregidas: apuntan al punto de la Autopista Norte que muestra el clip
    # (cerca de la Terminal del Norte), medido sobre la vista satelital. Las
    # anteriores (6.2442, -75.5812) eran de relleno y ponían la cámara a
    # varios kilómetros de donde realmente mira.
    lat: 6.278391
    lng: -75.572262
    # Homografía imagen -> metros sobre el asfalto, calibrada con
    # scripts/homography_picker.py sobre un rectángulo de 12,1 x 11,2 m
    # medido en la vista satelital. Comprobación: implica que un carro de
    # 4,5 m ocupa ~90 px de alto abajo del encuadre, que es lo que miden las
    # cajas del detector ahí.
    homography: [0.03869724374, 0.05139477684, -11.64605643, 0.00395498769, -0.1415885593, 28.32483084, 0.0002968835874, 0.003611614935, 0.3089726202]
    # PROVISIONAL: es la ROI de la otra cámara. Encaja aproximadamente, pero
    # la franja excluida cae sobre un carril real. Redibujar con:
    #   scripts/roi_picker.py --camera cra55_cl37 --frame 900
    roi: "0.0021,0.9891 0.0031,0.5043 0.3075,0.0065 0.4655,0.0087 0.3316,0.9935 0.4446,0.9978 0.4833,0.0043 0.6056,0.0000 0.9927,0.7739 0.9937,0.9891"
    perspective: 2.5
    thresholds:
      occupancy_medium: 0.18
      occupancy_high: 0.32
      free_speed: 0.060
    notes: "Calibrada con los frames 600-1400. ROI provisional, falta redibujarla."
